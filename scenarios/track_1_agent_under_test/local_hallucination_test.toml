# Local test-set scenario for running ONLY hallucination tasks
# Model: dragonstorm123/qwen3.5-4b-sft-hallucination served via vLLM (port 8000, name: hallucination)
# Disables base and disambiguation tasks for hallucination task evaluation.

[evaluator]
endpoint = "http://127.0.0.1:8081"
cmd = ".venv/bin/python src/evaluator/server.py --host 127.0.0.1 --port 8081"

[agent_under_test]
endpoint = "http://127.0.0.1:8080"
cmd = "env AGENT_API_BASE=http://127.0.0.1:8000/v1 AGENT_API_KEY=local-dummy-key .venv/bin/python src/track_1_agent_under_test/server.py --host 127.0.0.1 --port 8080 --agent-llm openai/hallucination --temperature 0.0"

[config]
num_trials = 3
task_split = "test"
tasks_base_num_tasks = 0
tasks_hallucination_num_tasks = -1
tasks_disambiguation_num_tasks = 0
max_steps = 50
user_model = "openai/gpt-4o-mini"
user_provider = "openai"
user_thinking = false
policy_evaluator_model = "openai/deepseek-ai/deepseek-v4-pro-0813"
policy_evaluator_provider = "openai"
