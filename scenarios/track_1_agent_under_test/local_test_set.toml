# Local full test-set scenario for the baseline LiteLLM agent under test.

[evaluator]
endpoint = "http://127.0.0.1:8081"
cmd = ".venv/bin/python src/evaluator/server.py --host 127.0.0.1 --port 8081"

[agent_under_test]
endpoint = "http://127.0.0.1:8080"
cmd = ".venv/bin/python src/track_1_agent_under_test/server.py --host 127.0.0.1 --port 8080 --agent-llm gpt-4o-mini --temperature 0.0"

[config]
num_trials = 3
task_split = "test"
tasks_base_num_tasks = -1
tasks_hallucination_num_tasks = -1
tasks_disambiguation_num_tasks = -1
max_steps = 50
user_model = "gpt-4o-mini"
user_provider = "openai"
policy_evaluator_model = "google/gemma-4-31b-it"
policy_evaluator_provider = "openai"
